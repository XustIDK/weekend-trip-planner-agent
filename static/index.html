<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>周末去哪儿 · 行程规划助手</title>
  <style>
    :root{--ink:#22231f;--muted:#77796f;--line:#e7e8e1;--paper:#f7f8f3;--green:#16a36a;--pale:#e9f7ef;--orange:#f3a43b}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Segoe UI","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif}
    .app{max-width:1100px;margin:0 auto;padding:28px 22px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;min-height:100vh}
    header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:var(--green);color:white;display:grid;place-items:center;font-size:22px}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.new{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 13px;cursor:pointer;color:var(--ink)}
    .chat,.side{background:white;border:1px solid var(--line);border-radius:18px}.chat{display:flex;flex-direction:column;min-height:calc(100vh - 120px);overflow:hidden}.chathead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.chathead strong{font-size:14px}.status{font-size:12px;color:var(--green);display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
    #feed{padding:24px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:16px}.msg{max-width:82%;padding:12px 15px;border-radius:15px;white-space:pre-wrap}.assistant{background:#f2f4ef;align-self:flex-start;border-bottom-left-radius:4px}.user{background:var(--pale);align-self:flex-end;border-bottom-right-radius:4px}.welcome{max-width:610px;color:var(--muted);font-size:13px}.composer{padding:14px;border-top:1px solid var(--line)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.chip{font-size:12px;padding:6px 10px;border-radius:20px;background:#f5f6f1;border:1px solid var(--line);cursor:pointer;color:#56594f}.inputrow{display:flex;gap:10px;align-items:end}.inputrow textarea{flex:1;resize:none;min-height:46px;max-height:140px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;outline:none}.inputrow textarea:focus{border-color:#8ec9a7}.send{height:46px;border:0;border-radius:12px;background:var(--green);color:white;padding:0 19px;font-weight:600;cursor:pointer}.send:disabled{opacity:.5;cursor:wait}
    .side{padding:18px;height:max-content;position:sticky;top:20px}.side h2{font-size:14px;margin:0 0 14px}.section{margin:18px 0}.label{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:8px}.memory{display:grid;gap:8px}.memoryrow{display:flex;justify-content:space-between;gap:8px;font-size:12px}.memoryrow span:first-child{color:var(--muted)}.memoryrow span:last-child{text-align:right;max-width:65%}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:11px;border-radius:20px;padding:4px 8px;background:#f1f3ed;color:#55584e}.empty{font-size:12px;color:#a0a196}.round{font-size:12px;color:var(--muted);margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
    .plan{margin-top:10px;background:#fffdf7;border:1px solid #f2e6c9;border-radius:13px;padding:15px}.plan h3{font-size:15px;margin:0 0 5px}.plan .summary{font-size:12px;color:var(--muted);margin-bottom:12px}.day{border-top:1px solid #f0eadb;padding:10px 0}.daytitle{font-weight:600;font-size:12px;margin-bottom:6px}.item{display:grid;grid-template-columns:43px 1fr auto;gap:7px;margin:7px 0;font-size:12px}.time{color:var(--muted)}.kind{color:#85877d}.cost{color:#ab7419}.total{font-weight:700;font-size:13px;padding-top:8px;border-top:1px solid #f0eadb;display:flex;justify-content:space-between}.finalmark{font-size:11px;color:var(--green);margin-bottom:7px}.err{color:#b24438;background:#fff0ee;border-radius:9px;padding:10px 12px;font-size:12px}
    .msg.assistant{white-space:normal}
    .msg.assistant p{margin:0 0 8px}.msg.assistant p:last-child{margin-bottom:0}
    .msg.assistant h1,.msg.assistant h2,.msg.assistant h3,.msg.assistant h4{margin:10px 0 6px;font-size:15px;line-height:1.4}
    .msg.assistant ul,.msg.assistant ol{margin:0 0 8px;padding-left:22px}
    .msg.assistant li{margin:3px 0}
    .msg.assistant code{background:#e9ece2;border-radius:4px;padding:1px 4px;font-size:12px;font-family:Consolas,'Courier New',monospace}
    .msg.assistant pre{background:#f4f6ef;border:1px solid #e2e5da;border-radius:8px;padding:10px 12px;overflow:auto;margin:6px 0}
    .msg.assistant pre code{background:none;padding:0;font-size:12px}
    .msg.assistant blockquote{margin:6px 0;padding-left:10px;border-left:3px solid #d9e2cf;color:#5b5f52}
    .msg.assistant a{color:var(--green)}
    .msg.assistant hr{border:0;border-top:1px solid #e2e5da;margin:10px 0}
    .tablewrap{overflow:auto;margin:8px 0}
    .msg.assistant table{border-collapse:collapse;font-size:12.5px;min-width:60%}
    .msg.assistant th,.msg.assistant td{border:1px solid #dfe2d8;padding:5px 9px;text-align:left;vertical-align:top}
    .msg.assistant th{background:#eef1e8;font-weight:600}
    .msg.assistant .md-hint{display:block;margin-top:6px;font-size:11px;color:#9a9c90}
    @media(max-width:780px){.app{grid-template-columns:1fr;padding:15px}.side{position:static;order:3}.chat{min-height:65vh}.msg{max-width:92%}}
  </style>
</head>
<body><main class="app">
  <header><div class="brand"><div class="logo">周</div><div><h1>周末去哪儿</h1><p>和你一起把计划慢慢调到刚刚好</p></div></div><button class="new" id="newSession">＋ 新建行程</button></header>
  <section class="chat"><div class="chathead"><strong>规划对话</strong><span class="status"><i class="dot"></i>在线规划中</span></div><div id="feed"></div><div class="composer"><div class="chips"><button class="chip">我想安排一个周末短途游</button><button class="chip">把节奏放慢一点</button><button class="chip">生成最终方案</button></div><div class="inputrow"><textarea id="input" placeholder="告诉我出发地、预算、同行人或你想调整的地方…"></textarea><button id="send" class="send">发送</button></div></div></section>
  <aside class="side"><h2>这趟行程的记忆</h2><div id="memory"></div><div id="layerbox"></div><div class="round" id="round">对话第 0 轮</div><div id="plan"></div><p class="welcome">规划助手会记住你已经确认的信息。行程价格和营业信息可能变化，出发前请再核对。</p></aside>
</main>
<script>
const $=s=>document.querySelector(s);let sid=localStorage.getItem('weekend_session');let state=null;
const labels={origin:'出发地',dates:'日期',duration:'时长',budget:'总预算',party:'同行人',transport:'交通',pace:'节奏'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inlineMd(t){t=esc(t);t=t.replace(/\`([^\`]+)\`/g,'<code>$1</code>');t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');t=t.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');t=t.replace(/~~([^~]+)~~/g,'<del>$1</del>');t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');return t}
function splitRow(line){return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){return c.trim()})}
function normalizeLevels(raw){var levels=[];raw.forEach(function(it){if(levels.indexOf(it.indent)<0)levels.push(it.indent)});levels.sort(function(a,b){return a-b});raw.forEach(function(it){it.level=levels.indexOf(it.indent)});return raw}
function buildList(items,idx,level){var ordered=items[idx].ordered;var html=ordered?'<ol>':'<ul>';while(idx<items.length){var it=items[idx];if(it.level<level)break;if(it.level>level){var sub=buildList(items,idx,it.level);html=html.replace(/<\/li>$/,'')+sub.html+'</li>';idx=sub.idx;continue}html+='<li>'+inlineMd(it.text);if(idx+1<items.length&&items[idx+1].level>level){var sub2=buildList(items,idx+1,items[idx+1].level);html+=sub2.html;idx=sub2.idx}html+='</li>';idx++}html+=ordered?'</ol>':'</ul>';return{html:html,idx:idx}}
function md(src){var lines=String(src||'').replace(/\r\n/g,'\n').split('\n');var out=[];var i=0;
  function isTableRow(l){return /^\s*\|.*\|\s*$/.test(l)}
  function isDivider(l){return /^\s*\|[\s:|-]+\|\s*$/.test(l)}
  while(i<lines.length){var line=lines[i];
    if(/^\s*\x60\x60\x60/.test(line)){i++;var buf=[];while(i<lines.length&&!/^\s*\x60\x60\x60/.test(lines[i])){buf.push(lines[i]);i++}i++;out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');continue}
    if(isTableRow(line)&&i+1<lines.length&&isDivider(lines[i+1])){var head=splitRow(line);i+=2;var rows=[];while(i<lines.length&&isTableRow(lines[i])){rows.push(splitRow(lines[i]));i++}
      out.push('<div class="tablewrap"><table><thead><tr>'+head.map(function(h){return '<th>'+inlineMd(h)+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inlineMd(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>');continue}
    var h=line.match(/^(#{1,4})\s+(.*)$/);if(h){var lv=h[1].length;out.push('<h'+lv+'>'+inlineMd(h[2])+'</h'+lv+'>');i++;continue}
    if(/^\s*([-*_])\1{2,}\s*$/.test(line)){out.push('<hr>');i++;continue}
    if(/^\s*>\s?/.test(line)){var q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++}out.push('<blockquote>'+q.map(inlineMd).join('<br>')+'</blockquote>');continue}
    var lm=line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);if(lm){var items=[];while(i<lines.length){var m=lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);if(!m)break;items.push({indent:m[1].replace(/\t/g,'  ').length,ordered:/\d/.test(m[2]),text:m[3]});i++}
      var res=buildList(normalizeLevels(items),0,0);out.push(res.html);continue}
    if(!line.trim()){i++;continue}
    var para=[];while(i<lines.length&&lines[i].trim()&&!/^\s*(\x60\x60\x60|>|[-*+]\s|\d+\.\s|#{1,4}\s)/.test(lines[i])&&!isTableRow(lines[i])){para.push(lines[i]);i++}
    out.push('<p>'+para.map(inlineMd).join('<br>')+'</p>')}
  return out.join('')}
function addMsg(role,text){var d=document.createElement('div');d.className='msg '+role;if(role==='user'){d.innerHTML=esc(text).replace(/\n/g,'<br>')}else{d.innerHTML=md(text)}$('#feed').append(d);$('#feed').scrollTop=$('#feed').scrollHeight}
function render(s){state=s;$('#feed').innerHTML='';if(!s.messages.length)addMsg('assistant','你好，我来帮你规划周末行程。先告诉我从哪里出发、准备哪天出行，以及大致预算；其他细节我们可以边聊边补。');else s.messages.forEach(m=>addMsg(m.role==='user'?'user':'assistant',m.content));
  const m=s.memory||{}, rows=Object.entries(labels).map(([k,v])=>`<div class="memoryrow"><span>${v}</span><span>${m[k]?esc(m[k]):'待补充'}</span></div>`).join('');let tags=[...(m.interests||[]),...(m.food_preferences||[]),...(m.constraints||[]),...(m.confirmed||[])];$('#memory').innerHTML=`<div class="memory">${rows}</div><div class="section"><div class="label">偏好与已确认</div><div class="tags">${tags.length?tags.map(x=>`<span class="tag">${esc(x)}</span>`).join(''):'<span class="empty">对话中逐步记录</span>'}</div></div>`;$('#round').textContent=`对话第 ${s.turn||0} 轮 · 记忆自动保存`;
  renderLayers(s);const p=s.final||s.draft;$('#plan').innerHTML=p?planHtml(p,!!s.final):'';
}
function renderLayers(s){const L=s.layers||{},sm=s.summary||{},lr=L.last_retrieval||{},a=L.archive||{};const sum=(sm.text||'').trim();const row=function(k,v){return '<div class="memoryrow"><span>'+k+'</span><span>'+v+'</span></div>'};const filled=Object.keys(s.memory||{}).filter(function(k){const v=s.memory[k];return v&&(!Array.isArray(v)||v.length)}).length;let html='<div class="section"><div class="label">记忆分层 · 4 层核心 + 1 层兜底</div><div class="memory">'+row('① 窗口','最近 '+(L.window_turns||0)+' 轮原文')+row('② 元数据',(s.meta&&s.meta.timezone)?(s.meta.timezone+' · '+(s.meta.device||'—')):'首轮对话后生成')+row('③ 档案卡',filled+' 项已记录')+row('④ 摘要',sum?(sum.length+' 字 · '+(sm.source==='llm'?'模型压缩':'抽取式')):'未触发')+row('⑤ 归档','已索引 '+(a.count||0)+' 条'+(lr.hits?' · 上次召回 '+lr.hits+' 条':''))+row('账本',(L.ledger_events||0)+' 条事件')+'</div><div class="empty" style="margin-top:8px;line-height:1.55">② 是本次会话的环境信息（时区 / 设备 / 场景），只用来调整时间表述和措辞；24 小时不用即作废，不写进长期记忆。</div>';if(sum){html+='<div class="label" style="margin-top:10px">摘要内容</div><div class="empty" style="color:#56594f">'+esc(sum)+'</div>'}if(lr.query){html+='<div class="label" style="margin-top:10px">上次召回</div><div class="empty" style="color:#56594f">“'+esc(lr.query)+'” → '+lr.hits+' 条'+(lr.top?'：'+esc(lr.top):'')+'</div>'}html+='</div>';$('#layerbox').innerHTML=html}
function planHtml(p,final){return `<div class="plan">${final?'<div class="finalmark">✓ 唯一最终方案</div>':'<div class="finalmark" style="color:#ad842f">当前草案 · 可继续微调</div>'}<h3>${esc(p.title)}</h3><div class="summary">${esc(p.summary)}</div>${(p.days||[]).map(d=>`<div class="day"><div class="daytitle">${esc(d.date)}</div>${(d.items||[]).map(i=>`<div class="item"><span class="time">${esc(i.time)}</span><span><b>${esc(i.name)}</b><br><span class="kind">${esc(i.kind)} · ${esc(i.detail)}</span></span><span class="cost">${esc(i.cost)}</span></div>`).join('')}</div>`).join('')}<div class="total"><span>预计总花费</span><span>${esc(p.estimated_total)}</span></div><div class="summary" style="margin:8px 0 0">${esc(p.budget_note)}</div></div>`}
async function request(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
async function init(){try{if(sid){const r=await fetch('/api/session/'+sid);if(r.ok){state=await r.json();render(state);return}}const s=await request('/api/session',{});sid=s.id;localStorage.setItem('weekend_session',sid);render(s)}catch(e){addMsg('assistant','暂时无法连接服务，请检查后端是否启动。')}}
async function send(text){text=text.trim();if(!text||!sid)return;addMsg('user',text);$('#input').value='';$('#send').disabled=true;try{const d=await request('/api/chat',{session_id:sid,message:text,timezone:(Intl.DateTimeFormat().resolvedOptions().timeZone||'')});render(d.session)}catch(e){const x=document.createElement('div');x.className='err';x.textContent=e.message;$('#feed').append(x)}finally{$('#send').disabled=false;$('#input').focus()}}
$('#send').onclick=()=>send($('#input').value);$('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send($('#input').value)}};document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>send(c.textContent));$('#newSession').onclick=async()=>{const s=await request('/api/session',{});sid=s.id;localStorage.setItem('weekend_session',sid);render(s)};init();
</script></body></html>
